<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบซ่อมบำรุงรถ · ฟาร์มสมบูรณ์</title>

<!--
  ==========================================================================
  ระบบบันทึกประวัติซ่อมบำรุงรถ — เว็บแอปแยกจากระบบขายไข่ (เวอร์ชันไม่ต้องบิลด์)
  แก้โค้ดได้ที่ไฟล์เดียว:  vehicles.jsx  (อยู่ข้างไฟล์นี้)
  วิธีเปิด: ดับเบิลคลิก "เปิดระบบซ่อมรถ.command"  →  http://127.0.0.1:5174
  ==========================================================================
-->

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: "Noto Sans Thai", system-ui, -apple-system, sans-serif; background: #FBF8F2; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #8a8170; text-align: center; }
  #boot .sp { width: 34px; height: 34px; border: 3px solid #eadfce; border-top-color: #E8943A; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
  window.__bootErr = function (msg) {
    var b = document.getElementById('boot');
    if (b) {
      b.innerHTML =
        '<div style="max-width:560px;color:#b4451f;font-size:14px;line-height:1.6">' +
        '⚠️ โหลดแอปไม่สำเร็จ<br>' +
        '<pre style="white-space:pre-wrap;text-align:left;background:#fff;padding:12px;border-radius:8px;border:1px solid #eee;color:#444">' +
        String(msg) + '</pre>' +
        'ต้องต่ออินเทอร์เน็ตได้ (โหลด React / ไอคอน / Babel จาก CDN)</div>';
    }
  };
  window.addEventListener('error', function (e) { if (e && e.message) window.__bootErr(e.message); });
  window.addEventListener('unhandledrejection', function (e) { window.__bootErr((e.reason && e.reason.message) || e.reason || 'unhandled rejection'); });
</script>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <div id="boot">
    <div>
      <div class="sp"></div>
      <div style="margin-top:12px;font-size:15px">กำลังโหลดระบบซ่อมบำรุงรถ…</div>
    </div>
  </div>

  <script src="./supabase-config.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="./vehicles.jsx"></script>
</body>
</html>
